    <!-- Ignore Vite HMR WebSocket connection errors as specified in the environment runtime instructions: "HMR: Disabled. Ignore WebSocket errors." -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Intercept Vite HMR WebSocket connection attempts in Cloud Run iframe
          if (window.WebSocket) {
            try {
              var NativeWebSocket = window.WebSocket;
              window.WebSocket = new Proxy(NativeWebSocket, {
                construct: function(Target, args) {
                  var protocols = args[1];
                  if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                    var target = new EventTarget();
                    target.CONNECTING = 0;
                    target.OPEN = 1;
                    target.CLOSING = 2;
                    target.CLOSED = 3;
                    target.readyState = 1; // Immediate OPEN so @vite/client skips connection wait and never errors
                    target.send = function() {};
                    target.close = function() {};
                    target.onopen = null;
                    target.onmessage = null;
                    target.onclose = null;
                    target.onerror = null;
                    return target;
                  }
                  return new Target(args[0], args[1]);
                }
              });
            } catch (e) {}
          }

          // Suppress [vite] console errors & warnings per AI Studio instructions
          var origError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            if (args.length > 0) {
              var first = String(args[0]);
              if (first === '[vite]' || first.indexOf('[vite]') !== -1) {
                return;
              }
            }
            return origError.apply(console, args);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var args = Array.prototype.slice.call(arguments);
            if (args.length > 0) {
              var first = String(args[0]);
              if (first === '[vite]' || first.indexOf('[vite]') !== -1) {
                return;
              }
            }
            return origWarn.apply(console, args);
          };

          window.onerror = function(message, source) {
            if (
              (message && String(message).indexOf('[vite]') !== -1) ||
              (source && String(source).indexOf('@vite/client') !== -1)
            ) {
              return true; // prevent error bubbling
            }
          };

          window.addEventListener('error', function(event) {
            if (event && (
              (event.message && String(event.message).indexOf('[vite]') !== -1) ||
              (event.filename && String(event.filename).indexOf('@vite/client') !== -1)
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && (
              String(event.reason).indexOf('[vite]') !== -1 ||
              String(event.reason).indexOf('WebSocket') !== -1
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
